name: Steam Deck builds

# Builds the Linux AppImage in several configurations so they can be compared on a Steam Deck
# (picture checked, then the benchmark), changing one setting at a time:
#   A   reference: the same configuration as appimage.yml (no LTO, no -march)
#   B   A + Zen 2 code generation (-march=znver2)
#   B2  B with floating point contraction off (no fused multiply-add), in case B changes results
#   C   A + LTO
#   Cdiag    C with the diagnostics (BB_FRAME_TRACE) built in, to find the slow frames
#   pgogen   instrumented build (clang 19) that records a profile when played on the Deck
# .github/deck-builds-only.txt (optional) lists the variants to build, comma separated. When
# pgo-deck/ holds raw profiles from the Deck, the pgo-use job builds with them, using the LTO and
# code generation flags in .github/deck-pgo.env (BB_LTO=..., BB_ARCH_FLAGS=...).

on:
  push:
    branches: [deck-optim]

permissions:
  contents: read

concurrency:
  group: deck-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
      pgo_use: ${{ steps.pick.outputs.pgo_use }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          ONLY=A,B,B2,C,pgogen
          [ -f .github/deck-builds-only.txt ] && ONLY=$(tr -d ' \n' < .github/deck-builds-only.txt)
          export ONLY
          if ls pgo-deck/*.profraw >/dev/null 2>&1; then echo "pgo_use=true" >> "$GITHUB_OUTPUT"; else echo "pgo_use=false" >> "$GITHUB_OUTPUT"; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # clang '' = Ubuntu's clang (the configuration of appimage.yml). clang 20 cannot build
          # liverpool.cpp with Ubuntu's libstdc++ 14 (std::jthread with bind_front), so the PGO
          # builds use clang 19.
          all_variants = [
              {"name": "A", "lto": "OFF", "arch": "", "clang": "", "pgo": "off"},
              {"name": "B", "lto": "OFF", "arch": "-march=znver2 -mtune=znver2", "clang": "", "pgo": "off"},
              {"name": "B2", "lto": "OFF", "arch": "-march=znver2 -mtune=znver2 -ffp-contract=off", "clang": "", "pgo": "off"},
              {"name": "C", "lto": "ON", "arch": "", "clang": "", "pgo": "off"},
              {"name": "pgogen", "lto": "OFF", "arch": "", "clang": "19", "pgo": "generate"},
              {"name": "Cdiag", "lto": "ON", "arch": "", "clang": "", "pgo": "off", "diag": "ON"},
          ]
          wanted = {v.strip() for v in os.environ["ONLY"].split(",") if v.strip()}
          picked = [v for v in all_variants if v["name"] in wanted]
          print("matrix=" + json.dumps({"include": picked}))
          print("any=" + ("true" if picked else "false"))
          PY

  variants:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BB_LTO: ${{ matrix.lto }}
      BB_PGO: ${{ matrix.pgo }}
      BB_ARCH_FLAGS: ${{ matrix.arch }}
      BB_DIAGNOSTICS: ${{ matrix.diag || 'OFF' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates wget gnupg \
            clang lld \
            libvulkan-dev vulkan-tools \
            libfmt-dev libboost-dev libxxhash-dev libzydis-dev \
            libprotobuf-dev protobuf-compiler nlohmann-json3-dev \
            libssl-dev zlib1g-dev libpng-dev libminiupnpc-dev \
            glslang-tools libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxinerama-dev libxss-dev libxtst-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libxkbcommon-dev libudev-dev libdrm-dev \
            nasm squashfs-tools

      - name: Install clang ${{ matrix.clang }}
        if: matrix.clang != ''
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${{ matrix.clang }}
          echo "CC=clang-${{ matrix.clang }}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${{ matrix.clang }}" >> "$GITHUB_ENV"

      - name: Default compiler
        if: matrix.clang == ''
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          "$CC" --version | head -1
          echo "variant ${{ matrix.name }}: LTO $BB_LTO, PGO $BB_PGO, arch flags '${BB_ARCH_FLAGS}'"

      - name: Cache AppImage dependencies
        uses: actions/cache@v4
        with:
          path: out/deps
          key: appimage-deps-${{ runner.os }}-${{ hashFiles('packaging/appimage/fetch-deps.sh') }}

      - name: Fetch build dependencies
        run: bash packaging/appimage/fetch-deps.sh

      - name: Build the native Linux runtime
        run: bash build-linux.sh

      - name: Build the AppImage
        id: package
        env:
          APPIMAGE_ZSTD_LEVEL: '15'
        run: |
          version="deck${{ matrix.name }}-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          SKIP_BUILD=1 APPIMAGE_VERSION="$version" bash packaging/appimage/build-appimage.sh "$version"

      - name: Smoke-test the AppImage
        run: |
          appimage=$(ls release/driveclub-recomp-*-x86_64.AppImage)
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          (cd squashfs-root && ./AppRun --version && ./AppRun --selftest | tee ../selftest.txt)
          if grep -q 'not found' selftest.txt; then
            echo 'The AppImage has unresolved shared libraries.' >&2
            exit 1
          fi
          rm -rf squashfs-root selftest.txt

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: driveclub-recomp-${{ steps.package.outputs.version }}-x86_64.AppImage
          path: |
            release/driveclub-recomp-*-x86_64.AppImage
            release/driveclub-recomp-*-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: Build log on failure
        if: failure()
        run: |
          [ -f out/gpu-build.log ] && tail -150 out/gpu-build.log || true

  pgo-use:
    needs: plan
    if: needs.plan.outputs.pgo_use == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BB_PGO: 'use'
    steps:
      - uses: actions/checkout@v4

      - name: PGO build settings
        run: |
          BB_LTO=OFF; BB_ARCH_FLAGS=
          [ -f .github/deck-pgo.env ] && . .github/deck-pgo.env
          echo "BB_LTO=$BB_LTO" >> "$GITHUB_ENV"
          echo "BB_ARCH_FLAGS=$BB_ARCH_FLAGS" >> "$GITHUB_ENV"
          echo "PGO build: LTO $BB_LTO, arch flags '$BB_ARCH_FLAGS'"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates wget gnupg \
            libvulkan-dev vulkan-tools \
            libfmt-dev libboost-dev libxxhash-dev libzydis-dev \
            libprotobuf-dev protobuf-compiler nlohmann-json3-dev \
            libssl-dev zlib1g-dev libpng-dev libminiupnpc-dev \
            glslang-tools libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxinerama-dev libxss-dev libxtst-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libxkbcommon-dev libudev-dev libdrm-dev \
            nasm squashfs-tools
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 19
          echo "CC=clang-19" >> "$GITHUB_ENV"
          echo "CXX=clang++-19" >> "$GITHUB_ENV"

      - name: Merge the Deck profiles
        run: |
          ls -l pgo-deck/
          llvm-profdata-19 merge -o pgo-deck/default.profdata pgo-deck/*.profraw
          echo "BB_PGO_DIR=$PWD/pgo-deck" >> "$GITHUB_ENV"

      - name: Cache AppImage dependencies
        uses: actions/cache@v4
        with:
          path: out/deps
          key: appimage-deps-${{ runner.os }}-${{ hashFiles('packaging/appimage/fetch-deps.sh') }}

      - name: Fetch build dependencies
        run: bash packaging/appimage/fetch-deps.sh

      - name: Build the native Linux runtime
        run: bash build-linux.sh

      - name: Build the AppImage
        id: package
        env:
          APPIMAGE_ZSTD_LEVEL: '15'
        run: |
          version="deckpgo-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          SKIP_BUILD=1 APPIMAGE_VERSION="$version" bash packaging/appimage/build-appimage.sh "$version"

      - name: Smoke-test the AppImage
        run: |
          appimage=$(ls release/driveclub-recomp-*-x86_64.AppImage)
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          (cd squashfs-root && ./AppRun --version && ./AppRun --selftest | tee ../selftest.txt)
          if grep -q 'not found' selftest.txt; then
            echo 'The AppImage has unresolved shared libraries.' >&2
            exit 1
          fi
          rm -rf squashfs-root selftest.txt

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: driveclub-recomp-${{ steps.package.outputs.version }}-x86_64.AppImage
          path: |
            release/driveclub-recomp-*-x86_64.AppImage
            release/driveclub-recomp-*-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: Build log on failure
        if: failure()
        run: |
          [ -f out/gpu-build.log ] && tail -150 out/gpu-build.log || true
