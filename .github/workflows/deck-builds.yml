name: Steam Deck builds

# Builds the Linux AppImage in several configurations so they can be compared on a Steam Deck
# (picture checked, then the benchmark), changing one setting at a time:
#   A   reference: the same configuration as appimage.yml (no LTO, no -march)
#   B   A + Zen 2 code generation (-march=znver2)
#   B2  B with floating point contraction off (no fused multiply-add), in case B changes results
#   C   A + LTO
#   pgo-gen  instrumented build (clang 20) that records a profile when played on the Deck
# The PGO build that uses the profile is the separate "pgo-use" job, started by hand once the
# raw profiles from the Deck are in pgo-deck/.

on:
  workflow_dispatch:
    inputs:
      pgo_use:
        description: 'Build with the profile in pgo-deck/ (clang 20)'
        type: boolean
        default: false
      pgo_lto:
        description: 'LTO for the PGO build (ON/OFF)'
        default: 'OFF'
      pgo_arch:
        description: 'Extra code generation flags for the PGO build (empty for none)'
        default: ''
  push:
    branches: [deck-optim]

permissions:
  contents: read

concurrency:
  group: deck-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variants:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.pgo_use) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: A
            lto: 'OFF'
            arch: ''
            clang: ''
            pgo: 'off'
          - name: B
            lto: 'OFF'
            arch: '-march=znver2 -mtune=znver2'
            clang: ''
            pgo: 'off'
          - name: B2
            lto: 'OFF'
            arch: '-march=znver2 -mtune=znver2 -ffp-contract=off'
            clang: ''
            pgo: 'off'
          - name: C
            lto: 'ON'
            arch: ''
            clang: ''
            pgo: 'off'
          - name: pgogen
            lto: 'OFF'
            arch: ''
            clang: '20'
            pgo: 'generate'
    env:
      BB_LTO: ${{ matrix.lto }}
      BB_PGO: ${{ matrix.pgo }}
      BB_ARCH_FLAGS: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates wget gnupg \
            clang lld \
            libvulkan-dev vulkan-tools \
            libfmt-dev libboost-dev libxxhash-dev libzydis-dev \
            libprotobuf-dev protobuf-compiler nlohmann-json3-dev \
            libssl-dev zlib1g-dev libpng-dev libminiupnpc-dev \
            glslang-tools libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxinerama-dev libxss-dev libxtst-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libxkbcommon-dev libudev-dev libdrm-dev \
            nasm squashfs-tools

      - name: Install clang ${{ matrix.clang }}
        if: matrix.clang != ''
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${{ matrix.clang }}
          echo "CC=clang-${{ matrix.clang }}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${{ matrix.clang }}" >> "$GITHUB_ENV"

      - name: Default compiler
        if: matrix.clang == ''
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          "$CC" --version | head -1
          echo "variant ${{ matrix.name }}: LTO $BB_LTO, PGO $BB_PGO, arch flags '${BB_ARCH_FLAGS}'"

      - name: Cache AppImage dependencies
        uses: actions/cache@v4
        with:
          path: out/deps
          key: appimage-deps-${{ runner.os }}-${{ hashFiles('packaging/appimage/fetch-deps.sh') }}

      - name: Fetch build dependencies
        run: bash packaging/appimage/fetch-deps.sh

      - name: Build the native Linux runtime
        run: bash build-linux.sh

      - name: Build the AppImage
        id: package
        env:
          APPIMAGE_ZSTD_LEVEL: '15'
        run: |
          version="deck${{ matrix.name }}-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          SKIP_BUILD=1 APPIMAGE_VERSION="$version" bash packaging/appimage/build-appimage.sh "$version"

      - name: Smoke-test the AppImage
        run: |
          appimage=$(ls release/driveclub-recomp-*-x86_64.AppImage)
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          (cd squashfs-root && ./AppRun --version && ./AppRun --selftest | tee ../selftest.txt)
          if grep -q 'not found' selftest.txt; then
            echo 'The AppImage has unresolved shared libraries.' >&2
            exit 1
          fi
          rm -rf squashfs-root selftest.txt

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: driveclub-recomp-${{ steps.package.outputs.version }}-x86_64.AppImage
          path: |
            release/driveclub-recomp-*-x86_64.AppImage
            release/driveclub-recomp-*-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: Build log on failure
        if: failure()
        run: |
          [ -f out/gpu-build.log ] && tail -150 out/gpu-build.log || true

  pgo-use:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pgo_use }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BB_LTO: ${{ inputs.pgo_lto }}
      BB_PGO: 'use'
      BB_ARCH_FLAGS: ${{ inputs.pgo_arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates wget gnupg \
            libvulkan-dev vulkan-tools \
            libfmt-dev libboost-dev libxxhash-dev libzydis-dev \
            libprotobuf-dev protobuf-compiler nlohmann-json3-dev \
            libssl-dev zlib1g-dev libpng-dev libminiupnpc-dev \
            glslang-tools libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxinerama-dev libxss-dev libxtst-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libxkbcommon-dev libudev-dev libdrm-dev \
            nasm squashfs-tools
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          echo "CC=clang-20" >> "$GITHUB_ENV"
          echo "CXX=clang++-20" >> "$GITHUB_ENV"

      - name: Merge the Deck profiles
        run: |
          ls -l pgo-deck/
          llvm-profdata-20 merge -o pgo-deck/default.profdata pgo-deck/*.profraw
          echo "BB_PGO_DIR=$PWD/pgo-deck" >> "$GITHUB_ENV"

      - name: Cache AppImage dependencies
        uses: actions/cache@v4
        with:
          path: out/deps
          key: appimage-deps-${{ runner.os }}-${{ hashFiles('packaging/appimage/fetch-deps.sh') }}

      - name: Fetch build dependencies
        run: bash packaging/appimage/fetch-deps.sh

      - name: Build the native Linux runtime
        run: bash build-linux.sh

      - name: Build the AppImage
        id: package
        env:
          APPIMAGE_ZSTD_LEVEL: '15'
        run: |
          version="deckpgo-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          SKIP_BUILD=1 APPIMAGE_VERSION="$version" bash packaging/appimage/build-appimage.sh "$version"

      - name: Smoke-test the AppImage
        run: |
          appimage=$(ls release/driveclub-recomp-*-x86_64.AppImage)
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          (cd squashfs-root && ./AppRun --version && ./AppRun --selftest | tee ../selftest.txt)
          if grep -q 'not found' selftest.txt; then
            echo 'The AppImage has unresolved shared libraries.' >&2
            exit 1
          fi
          rm -rf squashfs-root selftest.txt

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: driveclub-recomp-${{ steps.package.outputs.version }}-x86_64.AppImage
          path: |
            release/driveclub-recomp-*-x86_64.AppImage
            release/driveclub-recomp-*-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: Build log on failure
        if: failure()
        run: |
          [ -f out/gpu-build.log ] && tail -150 out/gpu-build.log || true
